const PX = 6; // px per second
const lanes={jackson:12,chris:64,tyler:116};
const inner=document.getElementById('laneinner');
const tmin=Math.min(...TURNS.map(t=>t.a))-5, tmax=Math.max(...TURNS.map(t=>t.b))+5;
inner.style.width=((tmax-tmin)*PX+100)+'px';
for(const [p,y] of Object.entries(lanes)){
  const l=document.createElement('div');l.className='lane-label';l.style.position='absolute';
  l.style.top=(y+8)+'px';l.textContent=p;inner.appendChild(l);
}
function fmt(s){s=Math.round(s);const m=Math.floor(Math.abs(s)/60),ss=String(Math.abs(s)%60).padStart(2,'0');return (s<0?'-':'')+m+':'+ss}
for(const t of TURNS){
  const d=document.createElement('div');d.className='turn '+t.p;
  d.style.left=((t.a-tmin)*PX)+'px';d.style.width=(Math.max(3,(t.b-t.a)*PX))+'px';
  d.style.top=lanes[t.p]+'px';d.textContent=t.x;
  d.onclick=()=>{document.getElementById('detail').textContent=
    t.p.toUpperCase()+' ['+fmt(t.a)+'-'+fmt(t.b)+'] ('+t.a.toFixed(1)+'s): '+t.x};
  inner.appendChild(d);
}
const seq=document.getElementById('seq');
function render(){
  seq.innerHTML='';
  for(const b of BLOCKS){
    const c=document.createElement('div');c.className='card'+(b.removed?' removed':'');c.draggable=true;c.dataset.id=b.id;
    c.innerHTML=`<div class="chip ${b.person}"></div><div class="cid">${b.id}</div>
      <div class="ctime">${b.m0!=null?fmt(b.m0)+'–'+fmt(b.m1)+' · '+b.dur+'s':''}</div>
      <div class="ctext" title="click to expand/collapse" onclick="this.classList.toggle('expanded')">${(b.text||'').replace(/</g,'&lt;')}</div>
      <input class="note" placeholder="note" value="${b.note||''}" onchange="BLOCKS.find(x=>x.id=='${b.id}').note=this.value">
      <button onclick="toggle('${b.id}')">${b.removed?'undo':'✕'}</button>`;
    c.addEventListener('dragstart',e=>{c.classList.add('dragging');e.dataTransfer.setData('text',b.id)});
    c.addEventListener('dragend',()=>c.classList.remove('dragging'));
    c.addEventListener('dragover',e=>e.preventDefault());
    c.addEventListener('drop',e=>{e.preventDefault();
      const src=e.dataTransfer.getData('text');if(src==b.id)return;
      const si=BLOCKS.findIndex(x=>x.id==src),di=BLOCKS.findIndex(x=>x.id==b.id);
      const [m]=BLOCKS.splice(si,1);BLOCKS.splice(di,0,m);render()});
    seq.appendChild(c);
  }
}
function toggle(id){const b=BLOCKS.find(x=>x.id==id);b.removed=!b.removed;render()}
function exportPlan(){
  const out={order:BLOCKS.filter(b=>!b.removed).map(b=>b.id),
             removed:BLOCKS.filter(b=>b.removed).map(b=>b.id),
             notes:Object.fromEntries(BLOCKS.filter(b=>b.note).map(b=>[b.id,b.note]))};
  document.getElementById('out').value=JSON.stringify(out);
  document.getElementById('out').select();document.execCommand('copy');
}
render();
</script></body></html>
